<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Tabletop Manager - Cadastro</title>
        <link rel="stylesheet" th:href="@{css/auth.css}">
    </head>
    <body>
        <div class="page-bg">
            <div class="overlay"></div>
            <main class="auth-card">
                <h1>Cadastro</h1>
                <form id="registerForm" action="javascript:void(0)" method="post" th:object="${user}">
                    <div class="input-group">
                        <label for="registerName">Nome</label>
                        <input type="text" id="registerName" placeholder="Nome de usuário" th:field="*{nome}">
                        <span class="field-error" id="registerNameError"></span>
                    </div>
                    <div class="input-group">
                        <label for="registerEmail">E-mail</label>
                        <input type="text" id="registerEmail" placeholder="seu@email.com" th:field="*{email}">
                        <span class="field-error" id="registerEmailError"></span>
                    </div>
                    <div class="input-group">
                        <label for="registerPassword">Senha</label>
                        <input type="password" id="registerPassword" placeholder="Senha" th:field="*{senha}">
                        <span class="field-error" id="registerPasswordError"></span>
                    </div>
                    <div class="input-group">
                        <label for="registerConfirmPassword">Confirmar senha</label>
                        <input type="password" id="registerConfirmPassword" placeholder="Repita a senha">
                        <span class="field-error" id="registerConfirmPasswordError"></span>
                    </div>
                    <button type="submit">Cadastrar</button>
                </form>
                <p class="hint">Já tem conta? <a th:href="@{/}" href="/">Entrar</a></p>
            </main>
        </div>
        <div id="toast" class="toast"></div>
        <script th:src="@{/js/auth.js}"></script>
    </body>
</html>
