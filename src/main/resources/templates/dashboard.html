<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Tabletop Manager</title>
        <link rel="stylesheet" th:href="@{css/index.css}">
        <link rel="stylesheet" th:href="@{css/dnd-sheet.css}">
        <link rel="stylesheet" th:href="@{css/tft-sheet.css}">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,auto_stories,backpack,bedtime,check,close,dark_mode,edit,electric_bolt,grade,logout,menu,menu_book,more_vert,person,skull" />
    </head>
    <body>
        <div class="app-shell">
            <aside class="sidebar">
                <section class="sidebar-top">
                    <div class="tab-row">
                        <button class="tab selected" type="button">Todos</button>
                        <button class="tab" type="button">DND5E</button>
                        <button class="tab" type="button">TFT</button>
                    </div>
                </section>

                <section class="sidebar-middle">
                    <article class="character-card" th:each="p : ${resumos}" th:data-category="${p.sistema()}">
                        <img class="avatar" th:src="${p.avatarUrl() != null ? p.avatarUrl() : 'https://placehold.net/avatar.svg'}" alt="Avatar">
                        <div class="character-info">
                            <div class="name-row">
                                <h2 th:text="${p.nome()}"></h2>
                                <button class="card-action" type="button" aria-label="Opções">
                                    <span class="material-symbols-outlined">more_vert</span>
                                </button>
                            </div>

                            <div th:if="${p instanceof T(com.masuda.tabletopmanager.model.Personagem.Resumo.DndPersonagemResumo)}">
                                <p class="subtitle" th:text="${#strings.listJoin(p.classes(), ' | ')}"></p>
                            </div>

                            <div th:if="${p instanceof T(com.masuda.tabletopmanager.model.Personagem.Resumo.TftPersonagemResumo)}">
                                <p class="subtitle" th:text="${p.sin()}"></p>
                            </div>

                        </div>
                    </article>
                    <article class="character-card add-character-card hidden">
                        <div class="character-info">
                            <div class="add-name-row">
                                <input class="new-character-name" type="text" placeholder="Nome do personagem">
                                <button class="save-new-character" type="button" aria-label="Salvar">
                                    <span class="material-symbols-outlined">check</span>
                                </button>
                                <button class="cancel-new-character" type="button" aria-label="Cancelar">
                                    <span class="material-symbols-outlined">close</span>
                                </button>
                            </div>
                            <select class="new-character-system">
                                <option value="DND5E">DND5E</option>
                                <option value="TFT">TFT</option>
                            </select>
                        </div>
                    </article>
                </section>
            <button class="fab" type="button" aria-label="Adicionar personagem"><span class="material-symbols-outlined">add</span></button>

                <nav class="sidebar-bottom">
                    <button class="nav-item" type="button" aria-label="Menu">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                    <button class="nav-item" type="button" aria-label="Logout">
                        <span class="material-symbols-outlined">logout</span>
                    </button>
                </nav>
            </aside>

            <main class="content-pane">
                <div class="hero-panel">
                    <h1>Seus personagens</h1>
                    <p>Gerencie rapidamente suas fichas de RPG com a navegação lateral.</p>
                </div>
            </main>
        </div>
        <button class="menu-fab hidden" type="button" aria-label="Mostrar menu"><span class="material-symbols-outlined">menu</span></button>
        <script th:src="@{/js/sheet.js(v=2)}"></script>
        <script th:src="@{/js/main.js(v=2)}"></script>
    </body>
</html>
